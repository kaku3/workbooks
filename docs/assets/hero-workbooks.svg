<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
  <title>小さな問いから、仕事の学びをつなぐ</title>
  <desc>緑色のワークブックを中心に、読む、考える、確かめるの図が設計図のようにつながる。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#dcded5" opacity=".55"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="m1 1 3 3-3 3" stroke="#789488" stroke-width="1.2"/></marker>
  </defs>
  <path fill="#eeeee7" d="M0 0h960v720H0z"/>
  <path fill="url(#grid)" d="M32 32h896v656H32z"/>
  <path d="M32 52V32h20M908 32h20v20M928 668v20h-20M52 688H32v-20" stroke="#aab7aa" stroke-width="1.5"/>
  <g font-family="'Segoe UI',Arial,sans-serif" fill="#68746e" font-size="12" letter-spacing="2">
    <text x="64" y="73">WORKBOOKS / FIELD NOTES</text><text x="896" y="73" text-anchor="end">VOL. 01</text>
  </g>
  <g stroke="#789488" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M254 266h40v69h51"/><path d="M619 294h53v-78h29"/><path d="M714 322v132"/><path d="M666 514h-54"/><path d="M348 487h-63v41h-31"/>
  </g>
  <g fill="#eeeee7" stroke="#789488" stroke-width="1.5"><circle cx="294" cy="335" r="4"/><circle cx="672" cy="294" r="4"/></g>
  <!-- Reading note -->
  <rect x="64" y="158" width="190" height="186" rx="4" fill="#fdfdf9" stroke="#c5cdc2"/>
  <g font-family="'Segoe UI','Hiragino Sans',Meiryo,sans-serif"><text x="84" y="188" fill="#68746e" font-size="12" letter-spacing="1.5">01 / READ</text><text x="84" y="222" fill="#26352f" font-size="22" font-weight="500">読む</text></g>
  <path d="M84 250h148M84 268h112M84 286h134M84 304h88" stroke="#c5cdc2" stroke-width="3"/><path d="M84 268h66" stroke="#526b5f" stroke-width="3"/>
  <!-- Central workbook: offset pages, fine spine, no drop shadow -->
  <path d="M370 185h258v352H370z" fill="#fdfdf9" stroke="#aab7aa"/><path d="M360 195h258v352H360z" fill="#dce8e1" stroke="#aab7aa"/>
  <rect x="348" y="207" width="258" height="352" rx="4" fill="#344e42"/><path d="M372 207v352M388 245h194" stroke="#789488"/>
  <g font-family="'Segoe UI',Arial,sans-serif" fill="#dce8e1" font-size="10" letter-spacing="1.1"><text x="390" y="235">A LITTLE PRACTICE, EVERY DAY.</text><text x="390" y="534">THINK / CONNECT / TRY</text></g>
  <g font-family="'Segoe UI',Arial,sans-serif" fill="#fdfdf9" font-size="43" font-weight="500" letter-spacing="-1.5"><text x="387" y="305">WORK</text><text x="387" y="350">BOOKS.</text></g>
  <g stroke="#a6bcab" stroke-width="1.5"><rect x="391" y="402" width="45" height="37" rx="2"/><rect x="523" y="402" width="45" height="37" rx="2"/><path d="M436 420h29m26 0h32M480 433v39h49"/><path d="m480 407 13 13-13 13-13-13z" fill="#dce8e1"/><circle cx="542" cy="472" r="13"/><path d="m536 472 4 4 8-9" stroke="#dce8e1"/></g>
  <!-- A question becomes a design decision -->
  <rect x="702" y="158" width="194" height="164" rx="4" fill="#fdfdf9" stroke="#c5cdc2"/>
  <g font-family="'Segoe UI','Hiragino Sans',Meiryo,sans-serif"><text x="722" y="188" fill="#68746e" font-size="12" letter-spacing="1.5">02 / THINK</text><text x="722" y="222" fill="#26352f" font-size="22" font-weight="500">考える</text><text x="866" y="285" fill="#526b5f" font-size="64" font-weight="300" text-anchor="end">?</text></g>
  <path d="M722 254h69M722 272h51M722 290h62" stroke="#c5cdc2" stroke-width="3"/>
  <!-- Validation echoes the featured design drill -->
  <rect x="666" y="454" width="230" height="142" rx="4" fill="#dce8e1" stroke="#aab7aa"/>
  <g font-family="'Segoe UI','Hiragino Sans',Meiryo,sans-serif"><text x="686" y="484" fill="#526b5f" font-size="12" letter-spacing="1.5">03 / TRY</text><text x="686" y="518" fill="#26352f" font-size="22" font-weight="500">確かめる</text><text x="686" y="570" fill="#526b5f" font-size="12" letter-spacing="1">TEST PASSED</text></g>
  <circle cx="857" cy="550" r="19" stroke="#526b5f" stroke-width="1.5"/><path d="m848 550 6 6 12-13" stroke="#526b5f" stroke-width="2"/>
  <g font-family="'Segoe UI','Hiragino Sans',Meiryo,sans-serif"><text x="84" y="480" fill="#68746e" font-size="12" letter-spacing="1.5">CONNECT THE DOTS.</text><text x="84" y="515" fill="#26352f" font-size="20" font-weight="500">学びを、仕事へ。</text></g>
  <g stroke="#789488" stroke-width="1.5"><circle cx="93" cy="552" r="8" fill="#eeeee7"/><path d="M101 552h38m16 0h38m16 0h37"/><circle cx="147" cy="552" r="8" fill="#dce8e1"/><circle cx="201" cy="552" r="8" fill="#789488"/><path d="m240 546 6 6-6 6"/></g>
  <path d="M64 633h832" stroke="#c5cdc2"/>
  <g font-family="'Segoe UI','Hiragino Sans',Meiryo,sans-serif" fill="#68746e" font-size="12"><text x="64" y="660" letter-spacing="1">小さな問いから、ひとつずつ。</text><text x="896" y="660" text-anchor="end" letter-spacing="1.5">FOR CURIOUS ENGINEERS</text></g>
</svg>